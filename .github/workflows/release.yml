name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check plugin.json version matches tag
        run: |
          VERSION=$(jq -r .version learning/.claude-plugin/plugin.json)
          if [ "$VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag says ${{ steps.tag.outputs.version }}, plugin.json says $VERSION"; exit 1
          fi

      - name: Validate manifests
        run: jq empty .claude-plugin/marketplace.json learning/.claude-plugin/plugin.json

      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.tag.outputs.version }}" '
            $0 ~ "^## \\["ver"\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' learning/CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: learning ${{ steps.tag.outputs.version }}
          body_path: release-notes.md
