name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin.json version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match plugin.json version $VERSION"; exit 1
          fi

      - name: Validate JSON manifests
        run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json

      - name: Extract changelog section
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\["ver"\\]" {p=1; next}
            p && /^## \[/ {exit}
            p {print}
          ' CHANGELOG.md > release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
